services:
  cogni-routine:
    build:
      context: .
      dockerfile: Dockerfile
    image: cogni-routine:local
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - cogni-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cogni-data:
